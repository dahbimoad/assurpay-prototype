<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>AssurPay Simple</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --bg:#F2F4F1;--surface:#FFFFFF;--surface-2:#F6F8F5;--line:#DCE2DB;--line-2:#C9D2C8;
  --text:#16201D;--muted:#5A6863;--faint:#8A9893;
  --accent:#0D6657;--accent-ink:#FFFFFF;--accent-soft:#DDEFEA;
  --ink:#27449A;
  --good:#1D7443;--good-soft:#E1F2E6;--warn:#9A5A00;--warn-soft:#FBEED6;--bad:#B0261E;--bad-soft:#FBE4E1;
  --side:#0C3A33;--side-2:#124A41;--side-text:#D3E8E2;--side-muted:#86ADA4;
  --portal:#2E3A55;--overlay:rgba(9,20,17,.48);
  --shadow:0 1px 2px rgba(14,30,26,.06),0 6px 20px rgba(14,30,26,.07);
  --grid:rgba(13,102,87,.07);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1412;--surface:#151D1A;--surface-2:#1A2421;--line:#27332F;--line-2:#34423D;
  --text:#E5ECE9;--muted:#98A8A2;--faint:#6E7F79;
  --accent:#3DB39D;--accent-ink:#04211B;--accent-soft:#15352E;--ink:#93AAF2;
  --good:#5BC98A;--good-soft:#14301F;--warn:#E6A640;--warn-soft:#33270F;--bad:#F07D72;--bad-soft:#3A1916;
  --side:#0A1916;--side-2:#11261F;--side-text:#CFE3DD;--side-muted:#7A9A92;
  --portal:#26304A;--overlay:rgba(0,0,0,.6);--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);--grid:rgba(61,179,157,.07);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1412;--surface:#151D1A;--surface-2:#1A2421;--line:#27332F;--line-2:#34423D;
  --text:#E5ECE9;--muted:#98A8A2;--faint:#6E7F79;
  --accent:#3DB39D;--accent-ink:#04211B;--accent-soft:#15352E;--ink:#93AAF2;
  --good:#5BC98A;--good-soft:#14301F;--warn:#E6A640;--warn-soft:#33270F;--bad:#F07D72;--bad-soft:#3A1916;
  --side:#0A1916;--side-2:#11261F;--side-text:#CFE3DD;--side-muted:#7A9A92;
  --portal:#26304A;--overlay:rgba(0,0,0,.6);--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);--grid:rgba(61,179,157,.07);
  color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--cond);margin:0;text-wrap:balance;letter-spacing:-.005em}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12.5px;color:var(--ink)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.tnum{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;overflow:auto;background:var(--side);color:var(--side-text);display:flex;flex-direction:column;padding:18px 12px 14px;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;font:700 19px var(--cond);color:#fff;letter-spacing:.01em}
.brand svg{width:30px;height:30px}
.brand small{display:block;font:500 11px var(--sans);color:var(--side-muted);letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-sec{font:600 10.5px var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--side-muted);padding:14px 10px 6px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;color:var(--side-text);cursor:pointer;text-align:left;font-weight:500}
.nav button:hover{background:var(--side-2)}
.nav button[aria-current="page"]{background:var(--side-2);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.nav .count{margin-left:auto;background:#E6A640;color:#2A1B00;font:600 11px var(--sans);border-radius:999px;padding:0 7px;line-height:18px}
.me{margin-top:auto;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px}
.me b{display:block;color:#fff;font-weight:600;font-size:13px}.me span{font-size:12px;color:var(--side-muted)}
.me .icon-btn{margin-left:auto;color:var(--side-text)}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:600 12px var(--sans);color:#fff;flex:none}
.side-ov{display:none}
.main-wrap{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 24px}
.top h1{font-size:20px;font-weight:600;white-space:nowrap}
.top .menu-btn{display:none}
.li a,.kv a{text-decoration:none}.li a:hover,.kv a:hover{text-decoration:underline}
.demo-tag{font:500 11px var(--sans);color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:2px 8px;white-space:nowrap}
.gsearch{position:relative;margin-left:auto;width:min(380px,100%)}
.gsearch input{width:100%;height:36px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text);padding:0 12px 0 34px;font:14px var(--sans)}
.gsearch>svg{position:absolute;left:10px;top:9px;color:var(--faint)}
.gres{position:absolute;right:0;left:0;top:42px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:420px;overflow:auto;padding:6px;z-index:40}
.gr-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:8px;border-radius:7px;cursor:pointer}
.gr-item:hover,.gr-item:focus-visible{background:var(--surface-2)}
.gr-item b{font-weight:600}.gr-item .grow{flex:1;min-width:0}
.gr-empty{padding:12px;color:var(--muted)}
.icon-btn{border:0;background:none;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none;position:relative}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.bell-wrap{position:relative}
.bell-dot{position:absolute;top:3px;right:2px;min-width:17px;height:17px;border-radius:999px;background:var(--bad);color:#fff;font:600 10.5px/17px var(--sans);text-align:center;padding:0 4px}
.bell-pop{position:absolute;right:0;top:42px;width:min(380px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:40;overflow:hidden}
.bell-pop header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.bell-pop header b{font:600 15px var(--cond)}
.bell-list{max-height:420px;overflow:auto}
.notif{display:flex;gap:10px;width:100%;border:0;background:none;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.notif:hover{background:var(--surface-2)}
.notif.unread{background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
.notif .dotl{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none}
.notif small{display:block;color:var(--faint);font-size:11.5px;margin-top:2px}
main{padding:22px 24px 48px;display:flex;flex-direction:column;gap:18px;min-width:0}

/* ---------- building blocks ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 13px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font:500 13px var(--sans);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{height:28px;padding:0 9px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn svg.i{width:15px;height:15px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;line-height:20px}
.pill svg.i{width:12px;height:12px}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pos{color:var(--good)}.neg{color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px;flex-wrap:wrap}
.card-h h2{font-size:16px;font-weight:600}
.card-b{padding:0 16px 16px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500}
.kpi .v{font:600 25px/1.2 var(--cond);font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--faint)}
.kpi.hl{background:var(--accent-soft);border-color:transparent}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--surface-2)}
tr.void td{color:var(--faint)}
tr.void td .nm{text-decoration:line-through}
tr.dayrow td{background:var(--surface-2);font:600 12px var(--sans);color:var(--muted);text-transform:capitalize;padding-top:7px;padding-bottom:7px}
tr.totrow td{font-weight:600;border-bottom:2px solid var(--line-2)}
.nm{font-weight:600}
.sub{display:block;color:var(--faint);font-size:12px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.lbl{font-size:12px;font-weight:500;color:var(--muted)}
.field small{font-size:11.5px;color:var(--faint)}
input,select,textarea{height:36px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--text);padding:0 10px;font:14px var(--sans);min-width:0;max-width:100%}
textarea{height:auto;padding:8px 10px;resize:vertical}
input[readonly]{background:var(--surface-2);color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.err{background:var(--bad-soft);color:var(--bad);padding:8px 10px;border-radius:8px;font-size:13px}
.hint{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.bar{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line);min-width:70px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li small{display:block;color:var(--faint);font-size:12px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:9px;width:100%;border:0;text-align:left;cursor:pointer;font-size:13px}
.alert svg.i{margin-top:1px;width:16px;height:16px}
.alert.bad{background:var(--bad-soft);color:var(--bad)}.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert span{color:var(--text)}
.alerts{display:flex;flex-direction:column;gap:6px}
input.sw{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:999px;background:var(--line-2);position:relative;cursor:pointer;border:0;padding:0;flex:none;transition:background .15s}
input.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
input.sw:checked{background:var(--accent)}
input.sw:checked::after{transform:translateX(16px)}
input.sw:disabled{opacity:.5;cursor:not-allowed}

/* ---------- drawer & modal ---------- */
.dr-ov{position:fixed;inset:0;background:var(--overlay);z-index:60}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--surface);z-index:61;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dr-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.dr-head h2{font-size:22px;font-weight:600}
.eyebrow{font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.dr-body{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:16px}
.dr-body h3{font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.dr-foot{border-top:1px solid var(--line);padding:12px 20px;display:flex;flex-wrap:wrap;gap:8px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px;margin:0}
.kv div{min-width:0}
.kv dt{font-size:11.5px;color:var(--faint)}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.money{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.money div{background:var(--surface);padding:10px 12px}
.money span{display:block;font-size:11.5px;color:var(--faint)}
.money b{font:600 18px var(--cond);font-variant-numeric:tabular-nums}
.papers{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px}
.paper{position:relative;padding:4px 0 12px 18px}
.paper::before{content:"";position:absolute;left:-6px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.paper.def::before{background:var(--accent)}
.paper.next::before{border-style:dashed;border-color:var(--faint)}
.paper small{display:block;color:var(--faint);font-size:12px}
.diff{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:2px}
.overlay{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:16px;z-index:80}
.modal{background:var(--surface);border-radius:14px;width:min(520px,100%);max-height:calc(100dvh - 32px);overflow:auto;box-shadow:var(--shadow)}
.m-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 6px}
.m-head h2{font-size:18px;font-weight:600}
.m-body{padding:8px 18px 18px;display:flex;flex-direction:column;gap:12px}
.m-body p{margin:0}
.m-foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding-top:4px}
.modal.ext{width:min(460px,100%)}
.ext-head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--side);color:#fff}
.ext-head b{display:block;font:600 14px var(--sans)}.ext-head span{font-size:11.5px;color:var(--side-muted)}
.ext-head .icon-btn{margin-left:auto;color:var(--side-text)}
.ext-head .icon-btn:hover{background:var(--side-2);color:#fff}
.ext-logo{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff}
.ext-ok{display:flex;gap:8px;align-items:center;background:var(--good-soft);color:var(--good);padding:9px 14px;font-weight:500;font-size:13px}
.capt{display:grid;grid-template-columns:1fr auto;gap:2px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.capt b{font-weight:600}
.capt .big{font:600 20px var(--cond);grid-row:span 2;align-self:center;text-align:right}
.seg{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.seg legend{font-size:12px;font-weight:500;color:var(--muted);padding:0;margin-bottom:6px}
.seg-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg-opts label{position:relative;display:flex;flex-direction:column;gap:1px;border:1px solid var(--line-2);border-radius:9px;padding:8px 10px;cursor:pointer;font-weight:500;font-size:13px}
.seg-opts label small{font-weight:400;font-size:11px;color:var(--faint)}
.seg-opts input{position:absolute;opacity:0;pointer-events:none}
.seg-opts label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.seg-opts label:has(input:disabled){opacity:.45;cursor:not-allowed}
.seg-opts label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.ecart-live{height:36px;display:flex;align-items:center;font:600 18px var(--cond);font-variant-numeric:tabular-nums}
.ecart-live small{font:500 12px var(--sans);margin-left:8px;color:var(--faint)}
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:100;max-width:calc(100vw - 32px)}
.toast{background:var(--text);color:var(--bg);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13px;display:flex;gap:8px;align-items:center;width:max-content;max-width:100%;animation:tin .2s ease-out}
.toast.ext{background:var(--side);color:#fff}
.toast svg.i{width:16px;height:16px}
@keyframes tin{from{transform:translateY(8px);opacity:.3}to{transform:none;opacity:1}}

/* ---------- portal ---------- */
.portal-layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.browser{border:1px solid var(--line-2);border-radius:12px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.bbar{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.dots{display:flex;gap:5px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line-2)}
.url{flex:1;height:28px;border-radius:999px;background:var(--bg);display:flex;align-items:center;gap:6px;padding:0 12px;font:12px var(--mono);color:var(--muted);min-width:0;overflow:hidden;white-space:nowrap}
.url span{overflow:hidden;text-overflow:ellipsis}

.sim{font:600 10.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.14);border-radius:4px;padding:3px 7px}

.pbody fieldset{border:1px solid var(--line);border-radius:10px;padding:12px 14px 14px;margin:0;display:flex;flex-direction:column;gap:12px;min-width:0}

.done{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.stamp{display:inline-flex;align-items:center;gap:8px;color:var(--good);font:600 18px var(--cond)}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;width:100%}
.nums div{border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.nums span{display:block;font-size:11.5px;color:var(--faint)}
.nums b{font:500 16px var(--mono);color:var(--ink)}

.extblock{margin:0 16px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--surface-2)}

.minis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 16px}
.minis div span{display:block;font-size:11px;color:var(--faint)}
.minis div b{font:600 15px var(--cond);font-variant-numeric:tabular-nums}

.login-form form{display:flex;flex-direction:column;gap:12px;max-width:380px;width:100%}
.login-form h2{font-size:26px;font-weight:600}
.demo-acc{max-width:380px;width:100%;display:flex;flex-direction:column;gap:8px}
.demo-acc p{margin:0;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.acc{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;cursor:pointer;text-align:left;width:100%}

function paperState(c){
  if(c.status!=='complet'||c.type==='comptant')return null;
  const p=lastPaper(c);if(!p)return null;
  if(p.type==='definitif')return{lvl:'good',text:'Définitif remis'};
  const d=daysUntil(p.fin);
  if(d<0)return{lvl:'bad',text:`Provisoire expiré depuis ${-d} j`,d};
  if(d<=5)return{lvl:'warn',text:d===0?"Provisoire expire aujourd'hui":`Provisoire · expire dans ${d} j`,d};
  return{lvl:'neutral',text:`Provisoire jusqu'au ${fshort(p.fin)}`,d};
}
function payPill(c){
  if(c.status==='annule')return '<span class="pill neutral">Annulé</span>';
  if(c.status==='a_completer')return `<span class="pill warn">${ic('clock')}À compléter</span>`;
  if(c.type==='comptant')return '<span class="pill neutral">Comptant</span>';
  const r=resteOf(c);
  if(r<=0)return `<span class="pill good">${ic('check')}Soldé</span>`;
  const ps=paperState(c);
  return `<span class="pill ${ps&&ps.lvl==='bad'?'bad':'warn'}">${c.type==='provisoire'?'Provisoire':'Crédit'} · reste ${dh(r)}</span>`;
}
function paidPill(c){
  if(c.status==='annule')return '<span class="pill neutral">Annulé</span>';
  if(c.status==='a_completer')return '<span class="pill warn">Encaissement non saisi</span>';

  const pays=scopePayments(),encT=sum(pays.filter(p=>dayKey(p.date)===tk).map(p=>p.montant)),encM=sum(pays.filter(p=>monthKey(p.date)===mk).map(p=>p.montant));
  const ecM=sum(month.map(ecartOf)),reste=sum(cs.map(resteOf)),nCred=cs.filter(c=>resteOf(c)>0).length;
  const kp=`<div class="kpis">
    <div class="kpi hl"><span class="l">Aujourd'hui</span><span class="v">${today.length} assurance${today.length>1?'s':''}</span><span class="s">${dh(encT)} encaissés</span></div>
    ${isAdmin()?`<button class="kpi" data-a="nav" data-id="axa" style="text-align:left;cursor:pointer;font:inherit;color:inherit"><span class="l">À payer à AXA · ${monthLabel(mk)}</span><span class="v">${dh(sum(month.map(c=>c.du)))}</span><span class="s">${month.length} contrats · voir chaque mois →</span></button>`:''}
    <div class="kpi"><span class="l">Encaissé ce mois</span><span class="v">${dh(encM)}</span><span class="s">en espèces</span></div>
    <div class="kpi"><span class="l">Écart du mois</span><span class="v ${ecCls(ecM)}">${sdh(ecM)}</span><span class="s">${ecM<0?'à payer de votre poche':ecM>0?'gagné sur les arrondis':'aucun arrondi'}</span></div>
    <div class="kpi"><span class="l">Crédits en cours</span><span class="v">${dh(reste)}</span><span class="s">${nCred} client${nCred>1?'s':''} doivent de l'argent</span></div>
  </div>`;
  if(!isAdmin())return `<div class="sec-h"><div><h2>Bonjour ${esc(ME().name.split(' ')[0])}</h2><p>${can('voirTout')?"Chiffres de toute l'agence.":'Vos chiffres personnels.'}</p></div></div>${kp}`;
  const al=alerts(),feed=[...S.audit].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,9);
  const rows=collabs().map(u=>{const m=month.filter(c=>c.collabId===u.id),mins=(Date.now()-new Date(u.ext.lastSeen))/6e4;return `<tr><td><span class="nm">${esc(u.name)}</span><span class="sub">${esc(u.ext.poste)}</span></td><td class="num">${m.length}</td><td class="num">${dh(sum(m.map(c=>c.du)))}</td><td class="num">${dh(sum(S.payments.filter(p=>p.userId===u.id&&monthKey(p.date)===mk).map(p=>p.montant)))}</td><td class="num ${ecCls(sum(m.map(ecartOf)))}">${sdh(sum(m.map(ecartOf)))}</td><td>${mins<=15?`<span class="pill good">${ic('check')}Active</span>`:`<span class="pill warn">Silence ${fmtMin(mins)}</span>`}</td></tr>`}).join('');
  return `<div class="sec-h"><div><h2>Bonjour ${esc(ME().name.split(' ')[0])}</h2><p>${longDay(tk)} · ${esc(S.settings.agence)}</p></div><button class="btn" data-a="nav" data-id="portal">${ic('globe')}Ouvrir le portail simulé</button></div>
  ${kp}
  <div class="cols">
    <section class="card"><div class="card-h"><h2>À traiter</h2><span class="pill ${al.length?'warn':'good'}">${al.length} point${al.length>1?'s':''}</span></div><div class="card-b">${al.length?`<div class="alerts">${al.map(x=>`<button class="alert ${x.lvl}" data-a="${x.a}" data-id="${x.id}">${ic('alert')}<span>${esc(x.text)}</span></button>`).join('')}</div>`:'<p class="muted">Rien à signaler.</p>'}</div></section>
    <section class="card"><div class="card-h"><h2>Activité en direct</h2><button class="btn sm ghost" data-a="nav" data-id="activite">Tout voir ${ic('arrow',14)}</button></div><div class="card-b list">${feed.map(feedItem).join('')}</div></section>
  </div>`;
};
function feedItem(a){const u=userOf(a.userId);return `<div class="li"><div class="av" style="background:${u.color};width:26px;height:26px;font-size:10.5px">${initials(u.name)}</div><div class="grow"><div>${a.contractId?`<a href="#" data-a="open-contract" data-id="${a.contractId}" style="color:inherit">${esc(a.text)}</a>`:esc(a.text)}</div><small>${esc(u.name)} · ${ago(a.date)}</small>${diffHtml(a)}</div></div>`}
function diffHtml(a){return a.diff&&a.diff.length?a.diff.map(d=>`<div class="diff">${esc(d.label)} : ${esc(d.from)} → ${esc(d.to)}</div>`).join(''):''}

PAGES.registre=()=>{
  const f=F.reg;if(!f.from){f.from=todayKey().slice(0,8)+'01';f.to=todayKey()}
  const wide=isAdmin()||can('voirTout');
  let cs=scopeContracts().filter(c=>{const k=dayKey(c.createdAt);return k>=f.from&&k<=f.to});
  if(f.collab)cs=cs.filter(c=>c.collabId===f.collab);
  if(f.cat)cs=cs.filter(c=>c.categorie===f.cat);
  if(f.type)cs=cs.filter(c=>f.type==='a_completer'||f.type==='annule'?c.status===f.type:c.status==='complet'&&(f.type==='credit'?c.type!=='comptant'&&resteOf(c)>0:c.type===f.type));
  if(f.q){const q=norm(f.q);cs=cs.filter(c=>matchContract(c,q))}
  cs.sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  const groups=[];let cur=null;cs.forEach(c=>{const k=dayKey(c.createdAt);if(!cur||cur.k!==k){cur={k,items:[]};groups.push(cur)}cur.items.push(c)});
  const v=cs.filter(c=>c.status!=='annule');
  const row=c=>{const cl=clientOf(c.clientId),ec=ecartOf(c),u=userOf(c.collabId);return `<tr class="row ${c.status==='annule'?'void':''}" data-a="open-contract" data-id="${c.id}" tabindex="0">
    <td class="tnum">${ftime(c.createdAt)}</td><td><span class="nm">${esc(fullName(cl))}</span></td><td>${esc(c.categorie)}<span class="sub">${c.duree} mois</span></td>
    <td><span class="mono">${c.attestation}</span><span class="sub mono">${c.police}</span></td><td class="mono">${c.quittance}</td>
    <td class="num">${dh(c.du)}</td><td class="num">${c.status==='complet'?dh(c.pris):'—'}</td><td class="num ${ecCls(ec)}">${c.status==='complet'&&ec?sdh(ec):''}</td>
    <td>${payPill(c)}</td>${wide?`<td><span class="av" style="background:${u.color};width:24px;height:24px;font-size:10px;display:inline-grid" title="${esc(u.name)}">${initials(u.name)}</span></td>`:''}</tr>`};
  const body=groups.map(g=>{const vv=g.items.filter(c=>c.status!=='annule');return `<tr class="dayrow"><td colspan="${wide?10:9}">${longDay(g.k)}</td></tr>${g.items.map(row).join('')}${isAdmin()?`<tr class="totrow"><td></td><td colspan="4">Total · ${vv.length} contrat${vv.length>1?'s':''}</td><td class="num">${dh(sum(vv.map(c=>c.du)))}</td><td class="num">${dh(sum(vv.filter(c=>c.status==='complet').map(c=>c.pris)))}</td><td class="num ${ecCls(sum(vv.map(ecartOf)))}">${sdh(sum(vv.map(ecartOf)))}</td><td colspan="${wide?2:1}"></td></tr>`:''}`}).join('');
  const sel=(id,key,opts,cur)=>`<select id="${id}" data-f="${key}">${opts.map(([v,l])=>`<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
  return `<div class="sec-h"><div><h2>${wide?"Registre de l'agence":'Mes saisies'}</h2><p>Chaque ligne vient d'une validation captée sur le portail de l'assureur. ${isAdmin()?"Seul l'administrateur peut modifier ou annuler une ligne.":"Pour corriger une ligne, signalez l'erreur à l'administrateur."}</p></div></div>
  <div class="filters">
    <div class="field"><label for="rf-from">Du</label><input type="date" id="rf-from" data-f="reg.from" value="${f.from}"></div>
    <div class="field"><label for="rf-to">Au</label><input type="date" id="rf-to" data-f="reg.to" value="${f.to}"></div>
    ${wide?`<div class="field"><label for="rf-col">Collaborateur</label>${sel('rf-col','reg.collab',[['','Tous'],...S.users.map(u=>[u.id,u.name])],f.collab)}</div>`:''}
    <div class="field"><label for="rf-cat">Catégorie</label>${sel('rf-cat','reg.cat',[['','Toutes'],...S.settings.categories.map(c=>[c,c])],f.cat)}</div>
    <div class="field"><label for="rf-type">Paiement</label>${sel('rf-type','reg.type',[['','Tous'],['comptant','Comptant'],['credit','Crédits non soldés'],['normal','Crédit normal'],['provisoire','Crédit provisoire'],['a_completer','À compléter'],['annule','Annulés']],f.type)}</div>
    <div class="field" style="flex:1;min-width:180px"><label for="rf-q">Rechercher</label><input id="rf-q" type="search" data-fq="reg.q" value="${esc(f.q)}" placeholder="Nom, police, quittance…"></div>
  </div>
  ${isAdmin()?`<div class="kpis"><div class="kpi"><span class="l">Contrats</span><span class="v">${v.length}</span></div><div class="kpi"><span class="l">Montant dû (primes)</span><span class="v">${dh(sum(v.map(c=>c.du)))}</span></div><div class="kpi"><span class="l">Montant pris</span><span class="v">${dh(sum(v.filter(c=>c.status==='complet').map(c=>c.pris)))}</span></div><div class="kpi"><span class="l">Écart net</span><span class="v ${ecCls(sum(v.map(ecartOf)))}">${sdh(sum(v.map(ecartOf)))}</span></div></div>`:''}
  <div class="tbl-wrap"><table><thead><tr><th>Heure</th><th>Nom et prénom</th><th>Catégorie</th><th>Attestation / Police</th><th>Quittance</th><th class="num">Dû</th><th class="num">Pris</th><th class="num">Écart</th><th>Paiement</th>${wide?'<th>Par</th>':''}</tr></thead><tbody>${body||`<tr><td colspan="10" class="empty">Aucune assurance pour ces filtres.</td></tr>`}</tbody></table></div>`;
};

PAGES.credits=()=>{
  const f=F.cred;
  let items=S.contracts.filter(c=>c.status==='complet'&&c.type!=='comptant').map(c=>({c,paid:paidOf(c),reste:resteOf(c),ps:paperState(c)}));
  const open=items.filter(x=>x.reste>0);
  const tabs=[['encours','En cours',open.length],['provisoire','Provisoires',open.filter(x=>x.c.type==='provisoire').length],['normal','Crédits normaux',open.filter(x=>x.c.type==='normal').length],['soldes','Soldés',items.filter(x=>x.reste<=0).length]];
  items=f.tab==='soldes'?items.filter(x=>x.reste<=0):f.tab==='encours'?open:open.filter(x=>x.c.type===f.tab);
  if(f.q){const q=norm(f.q);items=items.filter(x=>matchContract(x.c,q))}
  const rank=x=>x.ps&&x.ps.d!==undefined&&x.c.type==='provisoire'&&lastPaper(x.c).type==='provisoire'?x.ps.d:999;
  items.sort((a,b)=>rank(a)-rank(b)||b.reste-a.reste);
  const expiring=open.filter(x=>x.ps&&x.ps.d!==undefined&&x.ps.d>=0&&x.ps.d<=5).length,expired=open.filter(x=>x.ps&&x.ps.d<0).length;
  const rows=items.map(({c,paid,reste,ps})=>{const cl=clientOf(c.clientId),lp=paysOf(c).pop(),pct=Math.min(100,Math.round(paid/c.pris*100));return `<tr class="row" data-a="open-contract" data-id="${c.id}" tabindex="0">
    <td><span class="nm">${esc(fullName(cl))}</span><span class="sub">${esc(cl.tel)} · police ${c.police}</span></td>
    <td>${c.type==='provisoire'?'Provisoire':'Normal'}<span class="sub">${esc(c.categorie)} · ${c.duree} mois</span></td>
    <td class="num">${dh(c.pris)}</td><td class="num">${dh(paid)}</td>
    <td><div class="bar" title="${pct} %"><i style="width:${pct}%"></i></div></td>
    <td class="num"><b class="${reste>0?'neg':''}">${reste>0?dh(reste):'Soldé'}</b></td>
    <td>${ps?`<span class="pill ${ps.lvl}">${esc(ps.text)}</span>`:''}</td>
    <td class="tnum">${lp?fdate(lp.date):'—'}</td>
    <td><div style="display:flex;gap:6px">${reste>0&&can('paiements')?`<button class="btn sm" data-a="pay" data-id="${c.id}">Encaisser</button>`:''}${reste>0&&can('rappels')?`<button class="btn sm" data-a="wa" data-id="${c.id}" aria-label="Rappel WhatsApp">${ic('msg')}</button>`:''}</div></td></tr>`}).join('');
  return `<div class="sec-h"><div><h2>Crédits clients</h2><p>Crédit normal : le client a le définitif et doit encore de l'argent. Crédit provisoire : il n'a que des papiers provisoires et reçoit le définitif quand tout est payé.</p></div></div>
  ${isAdmin()?`<div class="kpis"><div class="kpi hl"><span class="l">Reste à encaisser</span><span class="v">${dh(sum(open.map(x=>x.reste)))}</span><span class="s">${open.length} crédit${open.length>1?'s':''} en cours</span></div><div class="kpi"><span class="l">Provisoires qui expirent sous 5 jours</span><span class="v">${expiring}</span></div><div class="kpi"><span class="l">Papiers provisoires expirés</span><span class="v ${expired?'neg':''}">${expired}</span><span class="s">client qui roule sans papier valide</span></div></div>`:''}
  <div class="tabs" role="tablist">${tabs.map(([k,l,n])=>`<button role="tab" aria-selected="${f.tab===k}" data-a="cred-tab" data-id="${k}">${l} · ${n}</button>`).join('')}</div>
  <div class="filters"><div class="field" style="flex:1;max-width:360px"><label for="cr-q">Rechercher</label><input id="cr-q" type="search" data-fq="cred.q" value="${esc(f.q)}" placeholder="Nom, téléphone, police…"></div></div>
  <div class="tbl-wrap"><table><thead><tr><th>Client</th><th>Type</th><th class="num">Total</th><th class="num">Payé</th><th>Progression</th><th class="num">Reste</th><th>Papier</th><th>Dernier paiement</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="9" class="empty">Aucun crédit dans cette liste.</td></tr>'}</tbody></table></div>`;
};

PAGES.clients=()=>{
  const q=norm(F.cli.q);
  let list=S.clients.map(cl=>{const cs=S.contracts.filter(c=>c.clientId===cl.id&&c.status!=='annule');return{cl,n:cs.length,reste:sum(cs.map(resteOf)),last:cs.map(c=>c.createdAt).sort().pop()}});
  if(q)list=list.filter(x=>[x.cl.nom,x.cl.prenom,x.cl.prenom+' '+x.cl.nom,x.cl.nom+' '+x.cl.prenom,x.cl.cin,x.cl.tel,x.cl.immat].some(v=>norm(v).includes(q)));
  list.sort((a,b)=>(b.last||'').localeCompare(a.last||''));
  return `<div class="sec-h"><div><h2>Clients</h2><p>${isAdmin()?S.clients.length+' clients. ':''}Un client est créé automatiquement à sa première validation sur le portail.</p></div></div>
  <div class="filters"><div class="field" style="flex:1;max-width:380px"><label for="cl-q">Rechercher</label><input id="cl-q" type="search" data-fq="cli.q" value="${esc(F.cli.q)}" placeholder="Nom, CIN, téléphone, immatriculation…"></div></div>
  <div class="tbl-wrap"><table><thead><tr><th>Client</th><th>CIN</th><th>Téléphone</th><th>Véhicule</th><th class="num">Contrats</th><th class="num">Reste dû</th><th>Dernière assurance</th></tr></thead><tbody>${list.map(x=>`<tr class="row" data-a="open-client" data-id="${x.cl.id}" tabindex="0"><td><span class="nm">${esc(fullName(x.cl))}</span></td><td class="mono">${esc(x.cl.cin)}</td><td class="tnum">${esc(x.cl.tel)}</td><td>${esc(x.cl.vehicule)}<span class="sub mono">${esc(x.cl.immat)}</span></td><td class="num">${x.n}</td><td class="num">${x.reste?`<b class="neg">${dh(x.reste)}</b>`:'—'}</td><td class="tnum">${x.last?fdate(x.last):'—'}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">Aucun client trouvé.</td></tr>'}</tbody></table></div>`;
};

PAGES.caisse=()=>{
  const tk=todayKey();
  if(!isAdmin()){
    const u=ME(),ex=expected(tk,u.id),cl=S.closes.find(x=>x.day===tk&&x.userId===u.id),hist=S.closes.filter(x=>x.userId===u.id).sort((a,b)=>b.day.localeCompare(a.day)).slice(0,8);
    return `<div class="sec-h"><div><h2>Ma caisse · ${longDay(tk)}</h2><p>Ce que vous avez encaissé aujourd'hui. Comptez l'argent le soir et clôturez : tout écart est signalé à l'administrateur.</p></div></div>
    <div class="kpis"><div class="kpi hl"><span class="l">Espèces attendues</span><span class="v">${dh(ex.esp)}</span></div><div class="kpi"><span class="l">Chèques attendus</span><span class="v">${dh(ex.chq)}</span></div><div class="kpi"><span class="l">Virements (info)</span><span class="v">${dh(ex.vir)}</span></div><div class="kpi"><span class="l">Opérations</span><span class="v">${ex.n}</span></div></div>
    <div class="cols">
      <section class="card"><div class="card-h"><h2>Encaissements du jour</h2></div><div class="card-b list">${ex.list.length?ex.list.sort((a,b)=>b.date.localeCompare(a.date)).map(p=>{const c=K(p.contractId);return `<div class="li"><div class="grow"><b>${esc(fullName(clientOf(c.clientId)))}</b><small>${ftime(p.date)} · ${p.mode} · police ${c.police}</small></div><b class="tnum">${dh(p.montant)}</b></div>`}).join(''):'<p class="muted">Aucun encaissement aujourd\'hui.</p>'}</div></section>
      <section class="card"><div class="card-h"><h2>Clôture du soir</h2>${cl?`<span class="pill good">${ic('check')}Clôturée à ${ftime(cl.closedAt)}</span>`:''}</div><div class="card-b">${cl?closeSummary(cl):`<form id="f-close" class="m-body" style="padding:0">
        <div class="grid2"><div class="field"><label for="cl-esp">Espèces comptées (DH)</label><input id="cl-esp" type="number" min="0" step="1" inputmode="numeric" required></div><div class="field"><label for="cl-chq">Chèques comptés (DH)</label><input id="cl-chq" type="number" min="0" step="1" inputmode="numeric" value="${ex.chq}"></div></div>
        <div id="cl-live" class="hint">Saisissez les espèces comptées.</div>
        <div class="field"><label for="cl-note">Note (si écart)</label><input id="cl-note" placeholder="Ex. : erreur de rendu de monnaie"></div>
        <div class="m-foot"><button class="btn primary" type="submit">Clôturer la caisse</button></div></form>`}</div></section>
    </div>
    ${hist.length?`<section><h2 style="font-size:16px;margin-bottom:10px">Mes dernières clôtures</h2>${closeTable(hist,false)}</section>`:''}`;
  }
  const day=F.caisse.day||tk;
  const people=S.users.filter(u=>u.role==='collab'||S.payments.some(p=>p.userId===u.id&&dayKey(p.date)===day));
  const rows=people.map(u=>{const ex=expected(day,u.id),cl=S.closes.find(x=>x.day===day&&x.userId===u.id);return `<tr><td><span class="nm">${esc(u.name)}</span><span class="sub">${esc(u.ext.poste)}</span></td><td class="num">${dh(ex.esp)}</td><td class="num">${dh(ex.chq)}</td><td class="num">${dh(ex.vir)}</td><td class="num">${cl?dh(cl.compteEsp+cl.compteChq):'—'}</td><td class="num ${cl?ecCls(cl.ecart):''}">${cl?sdh(cl.ecart):'—'}</td><td>${cl?`<span class="pill good">Clôturée ${ftime(cl.closedAt)}</span>`:ex.n?(day===tk?'<span class="pill neutral">En cours</span>':'<span class="pill warn">Non clôturée</span>'):'<span class="pill neutral">Aucune opération</span>'}${cl&&cl.note?`<span class="sub">${esc(cl.note)}</span>`:''}</td></tr>`}).join('');
  const hist=[...S.closes].sort((a,b)=>b.day.localeCompare(a.day)||a.userId.localeCompare(b.userId)).slice(0,14);
  return `<div class="sec-h"><div><h2>Caisse</h2><p>Ce que chaque collaborateur doit avoir en caisse, et ce qu'il a compté à la clôture.</p></div><div class="field"><label for="cs-day">Jour</label><input type="date" id="cs-day" data-f="caisse.day" value="${day}" max="${tk}"></div></div>
  <section><h2 style="font-size:16px;margin-bottom:10px;text-transform:capitalize">${longDay(day)}</h2><div class="tbl-wrap"><table><thead><tr><th>Collaborateur</th><th class="num">Espèces attendues</th><th class="num">Chèques attendus</th><th class="num">Virements</th><th class="num">Compté</th><th class="num">Écart</th><th>Statut</th></tr></thead><tbody>${rows}</tbody></table></div></section>

function closeSummary(cl){return `<dl class="kv"><div><dt>Espèces attendues</dt><dd>${dh(cl.attEsp)}</dd></div><div><dt>Espèces comptées</dt><dd>${dh(cl.compteEsp)}</dd></div><div><dt>Chèques</dt><dd>${dh(cl.compteChq)}</dd></div><div><dt>Écart</dt><dd class="${ecCls(cl.ecart)}">${sdh(cl.ecart)}</dd></div></dl>${cl.note?`<p class="muted" style="margin:10px 0 0">${esc(cl.note)}</p>`:''}`}
function closeTable(list,who){return `<div class="tbl-wrap"><table><thead><tr><th>Jour</th>${who?'<th>Collaborateur</th>':''}<th class="num">Attendu</th><th class="num">Compté</th><th class="num">Écart</th><th>Note</th></tr></thead><tbody>${list.map(c=>`<tr><td class="tnum">${fdate(c.day+'T12:00')}</td>${who?`<td>${esc(userOf(c.userId).name)}</td>`:''}<td class="num">${dh(c.attEsp+c.attChq)}</td><td class="num">${dh(c.compteEsp+c.compteChq)}</td><td class="num ${ecCls(c.ecart)}">${c.ecart?sdh(c.ecart):'0'}</td><td class="muted">${esc(c.note)}</td></tr>`).join('')}</tbody></table></div>`}

PAGES.ecarts=()=>{
  const months=[...new Set(S.contracts.map(c=>monthKey(c.createdAt)))].sort().reverse();
  const mk=F.ec.month||months[0]||todayKey().slice(0,7);
  const cs=S.contracts.filter(c=>c.status==='complet'&&monthKey(c.createdAt)===mk),withE=cs.filter(c=>ecartOf(c)!==0).sort((a,b)=>ecartOf(a)-ecartOf(b));

  return `<div class="sec-h"><div><h2>Écarts · ${monthLabel(mk)}</h2><p>La différence entre le montant dû à l'assureur et le montant pris au client (853 → 850, 805 → 810). Un écart net négatif, c'est ce que vous payez de votre poche ce mois-ci.</p></div><div class="field"><label for="ec-m">Mois</label><select id="ec-m" data-f="ec.month">${months.map(m=>`<option value="${m}" ${m===mk?'selected':''}>${monthLabel(m)}</option>`).join('')}</select></div></div>

  <div class="tbl-wrap"><table><thead><tr><th>Collaborateur</th><th class="num">Contrats</th><th class="num">Avec écart</th><th class="num">Pertes</th><th class="num">Gains</th><th class="num">Net</th><th class="num">Limite</th></tr></thead><tbody>${S.users.map(u=>{const m=cs.filter(c=>c.collabId===u.id);if(!m.length)return '';const e=m.map(ecartOf);return `<tr><td class="nm">${esc(u.name)}</td><td class="num">${m.length}</td><td class="num">${e.filter(x=>x).length}</td><td class="num neg">${sdh(sum(e.filter(x=>x<0)))}</td><td class="num pos">${sdh(sum(e.filter(x=>x>0)))}</td><td class="num ${ecCls(sum(e))}">${sdh(sum(e))}</td><td class="num">${u.role==='admin'?'—':'± '+u.maxEcart+' DH'}</td></tr>`}).join('')}</tbody></table></div>
  <section><h2 style="font-size:16px;margin-bottom:10px">Détail</h2><div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Client</th><th>Police</th><th class="num">Dû</th><th class="num">Pris</th><th class="num">Écart</th><th>Par</th></tr></thead><tbody>${withE.map(c=>`<tr class="row" data-a="open-contract" data-id="${c.id}" tabindex="0"><td class="tnum">${fdate(c.createdAt)}</td><td class="nm">${esc(fullName(clientOf(c.clientId)))}</td><td class="mono">${c.police}</td><td class="num">${dh(c.du)}</td><td class="num">${dh(c.pris)}</td><td class="num ${ecCls(ecartOf(c))}">${sdh(ecartOf(c))}</td><td>${esc(userOf(c.collabId).name)}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">Aucun écart ce mois-ci.</td></tr>'}</tbody></table></div></section>`;

PAGES.assureur=()=>{

  </div>`;

PAGES.axa=()=>{

/* ================= drawers ================= */
function openDrawer(type,id){DR={type,id};renderDrawer()}
function closeDrawer(){DR=null;renderDrawer()}
function renderDrawer(){const r=$('#drawer-root');if(!DR||!ME()){r.innerHTML='';return}const html=DR.type==='contract'?drawerContract(DR.id):drawerClient(DR.id);if(!html){DR=null;r.innerHTML='';return}r.innerHTML=`<div class="dr-ov" data-a="dr-ov"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="Détail">${html}</aside>`}
function drawerContract(id){
  const c=K(id);if(!c)return '';
  const cl=clientOf(c.clientId),col=userOf(c.collabId),paid=paidOf(c),reste=resteOf(c),ec=ecartOf(c),pays=paysOf(c),lp=lastPaper(c),me=ME();
  const hist=S.audit.filter(a=>a.contractId===c.id).sort((a,b)=>b.date.localeCompare(a.date));
  const acts=[];
  if(c.status==='a_completer'&&(isAdmin()||c.collabId===me.id))acts.push(`<button class="btn primary" data-a="complement" data-id="${c.id}">Compléter l'encaissement</button>`);
  if(c.status==='complet'&&reste>0&&can('paiements'))acts.push(`<button class="btn primary" data-a="pay" data-id="${c.id}">${ic('cash')}Encaisser un paiement</button>`);
  if(c.status==='complet'&&c.type==='provisoire'&&lp&&lp.type==='provisoire'){
    if(can('credit')&&reste>0)acts.push(`<button class="btn" data-a="paper" data-id="${c.id}">${ic('file')}Nouveau papier provisoire</button>`);
    if(can('definitif'))acts.push(`<button class="btn" data-a="definitif" data-id="${c.id}" ${reste>0?`disabled title="Reste ${dh(reste)} à payer avant le définitif"`:''}>${ic('check')}Remettre le définitif</button>`);
  }
  if(reste>0&&can('rappels'))acts.push(`<button class="btn" data-a="wa" data-id="${c.id}">${ic('msg')}Rappel WhatsApp</button>`);
  if(isAdmin()&&c.status!=='annule'){acts.push(`<button class="btn" data-a="edit" data-id="${c.id}">${ic('edit')}Modifier</button>`);acts.push(`<button class="btn danger" data-a="cancel" data-id="${c.id}">Annuler l'assurance</button>`)}
  if(!isAdmin())acts.push(`<button class="btn ghost" data-a="report" data-id="${c.id}">${ic('flag')}Signaler une erreur</button>`);
  const papers=c.status==='complet'&&c.type!=='comptant'?`<section><h3>Papiers remis</h3><div class="papers" style="margin-top:10px">${c.papiers.map(p=>`<div class="paper ${p.type==='definitif'?'def':''}"><b>${p.type==='definitif'?'Définitif':'Provisoire'}</b> · du ${fdate(p.debut)} au ${fdate(p.fin)}<small>Remis par ${esc(userOf(p.remisPar).name)} le ${fdate(p.remisLe)}</small></div>`).join('')}${c.type==='provisoire'&&lp&&lp.type==='provisoire'?`<div class="paper next"><b class="muted">Définitif</b><small>${reste>0?`Remis quand le reste (${dh(reste)}) sera payé.`:'Le crédit est soldé : le définitif peut être remis.'}</small></div>`:''}</div></section>`:'';
  return `<div class="dr-head"><div><div class="eyebrow">${esc(c.categorie)} · ${c.duree} mois</div><h2>${esc(fullName(cl))}</h2><div class="pills">${payPill(c)}${paperState(c)&&reste>0?`<span class="pill ${paperState(c).lvl}">${esc(paperState(c).text)}</span>`:''}<span class="pill neutral">${ic('puzzle')}Capté sur le portail</span></div></div><button class="icon-btn" data-a="close-drawer" aria-label="Fermer">${ic('x')}</button></div>
  <div class="dr-body">
    <dl class="kv"><div><dt>N° attestation</dt><dd class="mono">${c.attestation}</dd></div><div><dt>N° police</dt><dd class="mono">${c.police}</dd></div><div><dt>N° quittance</dt><dd class="mono">${c.quittance}</dd></div><div><dt>Validée le</dt><dd>${fdate(c.createdAt)} à ${ftime(c.createdAt)}</dd></div><div><dt>Par</dt><dd>${esc(col.name)}</dd></div><div><dt>Poste</dt><dd>${esc(c.poste)}</dd></div><div><dt>Période</dt><dd>${fdate(c.debut)} → ${fdate(c.fin)}</dd></div><div><dt>Client</dt><dd><a href="#" data-a="open-client" data-id="${cl.id}">${esc(cl.tel)} · ${esc(cl.cin)}</a></dd></div></dl>
    ${c.status==='annule'?`<div class="err">Annulée : ${esc(c.cancelReason||'')}</div>`:''}
    <section><h3>Montants</h3><div class="money" style="margin-top:10px"><div><span>Dû à l'assureur</span><b>${dh(c.du)}</b></div><div><span>Pris au client</span><b>${c.status==='complet'?dh(c.pris):'—'}</b></div><div><span>Écart</span><b class="${ecCls(ec)}">${c.status==='complet'?sdh(ec):'—'}</b></div>${c.type!=='comptant'&&c.status==='complet'?`<div><span>Payé</span><b>${dh(paid)}</b></div><div><span>Reste</span><b class="${reste>0?'neg':'pos'}">${reste>0?dh(reste):'Soldé'}</b></div>`:''}</div>
    ${c.status==='complet'?`<p class="muted" style="margin:8px 0 0;font-size:13px">${typeLabel(c.type)}${c.observation?` · ${esc(c.observation)}`:''}</p>`:''}</section>
    ${papers}
    <section><h3>Paiements</h3>${pays.length?`<div class="list" style="margin-top:4px">${pays.map((p,i)=>`<div class="li"><div class="grow"><b class="tnum">${dh(p.montant)}</b><small>${fdate(p.date)} à ${ftime(p.date)} · reçu par ${esc(userOf(p.userId).name)}</small></div><span class="muted tnum" style="font-size:12px">cumul ${dh(sum(pays.slice(0,i+1).map(x=>x.montant)))}</span></div>`).join('')}</div>`:'<p class="muted" style="margin:6px 0 0">Aucun paiement enregistré.</p>'}</section>
    <section><h3>Historique</h3><div class="list" style="margin-top:4px">${hist.map(feedItem).join('')}</div></section>
  </div>
  <div class="dr-foot">${acts.join('')}</div>`;
}
function drawerClient(id){
  const cl=S.clients.find(c=>c.id===id);if(!cl)return '';
  const cs=S.contracts.filter(c=>c.clientId===id).sort((a,b)=>b.createdAt.localeCompare(a.createdAt)),valid=cs.filter(c=>c.status!=='annule'),reste=sum(valid.map(resteOf));
  const open=valid.find(c=>resteOf(c)>0);
  return `<div class="dr-head"><div><div class="eyebrow">Fiche client</div><h2>${esc(fullName(cl))}</h2><div class="pills">${reste?`<span class="pill bad">Doit ${dh(reste)}</span>`:'<span class="pill good">Aucune dette</span>'}</div></div><button class="icon-btn" data-a="close-drawer" aria-label="Fermer">${ic('x')}</button></div>
  <div class="dr-body">
    <dl class="kv"><div><dt>CIN</dt><dd class="mono">${esc(cl.cin)}</dd></div><div><dt>Téléphone</dt><dd>${esc(cl.tel)}</dd></div><div><dt>Immatriculation</dt><dd class="mono">${esc(cl.immat)}</dd></div><div><dt>Véhicule</dt><dd>${esc(cl.vehicule)}</dd></div></dl>
    <div class="money"><div><span>Assurances</span><b>${valid.length}</b></div><div><span>Total pris</span><b>${dh(sum(valid.filter(c=>c.status==='complet').map(c=>c.pris)))}</b></div><div><span>Reste dû</span><b class="${reste?'neg':''}">${dh(reste)}</b></div></div>
    <section><h3>Assurances</h3><div class="list" style="margin-top:4px">${cs.map(c=>`<div class="li"><div class="grow"><a href="#" data-a="open-contract" data-id="${c.id}" style="color:inherit;font-weight:600">${esc(c.categorie)} · ${c.duree} mois</a><small>${fdate(c.createdAt)} · police ${c.police} · quittance ${c.quittance} · ${dh(c.du)}</small></div>${payPill(c)}</div>`).join('')}</div></section>
  </div>
  <div class="dr-foot">${can('clients')?`<button class="btn" data-a="client-edit" data-id="${cl.id}">${ic('edit')}Modifier la fiche</button>`:''}${open&&can('rappels')?`<button class="btn" data-a="wa" data-id="${open.id}">${ic('msg')}Rappel WhatsApp</button>`:''}</div>`;
}

/* ================= modals ================= */
function openModal(html,cls=''){$('#modal-root').innerHTML=`<div class="overlay" data-a="ov"><div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div></div>`;const f=$('#modal-root input:not([readonly]):not([type=radio]),#modal-root textarea,#modal-root select');if(f)setTimeout(()=>f.focus(),30)}
function closeModal(){$('#modal-root').innerHTML=''}
const mhead=t=>`<div class="m-head"><h2>${t}</h2><button class="icon-btn" data-a="close-modal" aria-label="Fermer">${ic('x')}</button></div>`;
function showErr(id,msg){const e=$('#'+id);if(e){e.textContent=msg;e.hidden=!msg}}
function toast(msg,kind=''){const t=document.createElement('div');t.className='toast '+kind;t.innerHTML=(kind==='ext'?ic('puzzle'):ic('check'))+`<span>${esc(msg)}</span>`;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),4200)}
function refresh(){save();renderMain();renderDrawer();const sh=$('#shell');if(sh&&isAdmin()){const c=sh.querySelector('.nav .count'),n=alerts().length;if(c)c.textContent=n}}

function openComplement(id,fromCapture){
  const c=K(id),cl=clientOf(c.clientId),u=ME(),canE=can('ecart'),canC=can('credit'),max=isAdmin()?null:u.maxEcart;
  openModal(`<div class="ext-head"><span class="ext-logo">${ic('puzzle',16)}</span><div><b>AssurPay Capture</b><span>Extension gérée par votre organisation</span></div><button class="icon-btn" data-a="close-modal" aria-label="Fermer">${ic('x')}</button></div>
  ${fromCapture?`<div class="ext-ok">${ic('check',16)}Validation enregistrée et envoyée à l'administrateur</div>`:''}
  <form id="f-complement" data-id="${c.id}" class="m-body" style="padding-top:14px" novalidate>
    <div class="capt"><b>${esc(fullName(cl))}</b><span class="big tnum">${dh(c.du)}</span><span class="muted" style="font-size:12.5px">${esc(c.categorie)} · police <span class="mono">${c.police}</span> · quittance <span class="mono">${c.quittance}</span></span></div>
    <div class="grid2"><div class="field"><label for="cp-pris">Montant pris au client (DH)</label><input id="cp-pris" type="number" inputmode="numeric" min="0" step="1" value="${c.du}" ${canE?'':'readonly'}><small>${canE?'Les deux montants sont gardés : le dû et le pris.':'Votre compte ne permet pas de changer le montant.'}</small></div><div class="field"><span class="lbl">Écart</span><div class="ecart-live" id="cp-ecart">0 DH</div></div></div>
    <fieldset class="seg"><legend>Le client paie</legend><div class="seg-opts">
      <label><input type="radio" name="cp-type" value="comptant" checked>Comptant<small>tout, maintenant</small></label>
      <label><input type="radio" name="cp-type" value="normal" ${canC?'':'disabled'}>Crédit normal<small>définitif remis</small></label>
      <label><input type="radio" name="cp-type" value="provisoire" ${canC?'':'disabled'}>Crédit provisoire<small>papier provisoire</small></label></div>
      ${canC?'':'<small class="faint" style="font-size:11.5px">Crédit non autorisé pour votre compte.</small>'}</fieldset>
    <div id="cp-credit" class="grid2" hidden><div class="field"><label for="cp-verse">Versé aujourd'hui (DH)</label><input id="cp-verse" type="number" min="0" step="1" inputmode="numeric" value="0"></div><div class="field" id="cp-jours-w"><label for="cp-jours">Papier provisoire (jours)</label><input id="cp-jours" type="number" min="1" max="90" value="${S.settings.dureeProvisoire}"></div></div>
    <div class="grid2"><div class="field"><label for="cp-obs">Observation</label><input id="cp-obs" placeholder="Ex. : passera vendredi" value="${esc(c.observation)}"></div></div>
    <div class="hint" id="cp-sum"></div>
    <div class="err" id="cp-err" hidden></div>
    <div class="m-foot">${fromCapture?'<button type="button" class="btn" data-a="later">Compléter plus tard</button>':''}<button class="btn primary" type="submit">Enregistrer</button></div>
  </form>`,'ext');
  updateComplementUI();
}
function updateComplementUI(){
  const f=$('#f-complement');if(!f)return;const c=K(f.dataset.id);
  const pris=Math.round(+$('#cp-pris').value||0),ec=pris-c.du,type=f.querySelector('input[name=cp-type]:checked').value,verse=Math.round(+$('#cp-verse').value||0);
  const e=$('#cp-ecart');e.className='ecart-live '+ecCls(ec);e.innerHTML=sdh(ec)+`<small>${ec<0?'perte pour l\'agence':ec>0?'gain':'montant exact'}</small>`;
  $('#cp-credit').hidden=type==='comptant';$('#cp-jours-w').hidden=type!=='provisoire';
  $('#cp-sum').textContent=type==='comptant'?`Le client paie ${dh(pris)} maintenant.`:`Le client verse ${dh(verse)} maintenant et doit encore ${dh(Math.max(0,pris-verse))}.${type==='provisoire'?` Il reçoit un papier provisoire de ${+$('#cp-jours').value||0} jours ; le définitif quand tout est payé.`:' Il reçoit le définitif maintenant.'}`;
}
function openPay(id){const c=K(id),r=resteOf(c);openModal(`${mhead('Encaisser un paiement')}<form id="f-pay" data-id="${id}" class="m-body" novalidate><p class="muted">${esc(fullName(clientOf(c.clientId)))} · police <span class="mono">${c.police}</span> · reste <b>${dh(r)}</b></p><div class="grid2"><div class="field"><label for="py-m">Montant reçu (DH)</label><input id="py-m" type="number" min="1" max="${r}" step="1" inputmode="numeric" value="${r}"></div></div><div class="err" id="py-err" hidden></div><div class="m-foot"><button type="button" class="btn" data-a="close-modal">Annuler</button><button class="btn primary" type="submit">Enregistrer le paiement</button></div></form>`)}
function openPaper(id){const c=K(id);openModal(`${mhead('Nouveau papier provisoire')}<form id="f-paper" data-id="${id}" class="m-body" novalidate><p class="muted">${esc(fullName(clientOf(c.clientId)))} · reste ${dh(resteOf(c))}. Le papier commence aujourd'hui.</p><div class="field"><label for="pp-j">Durée (jours)</label><input id="pp-j" type="number" min="1" max="90" value="${S.settings.dureeProvisoire}"></div><div class="err" id="pp-err" hidden></div><div class="m-foot"><button type="button" class="btn" data-a="close-modal">Annuler</button><button class="btn primary" type="submit">Remettre le papier</button></div></form>`)}
function openDefinitif(id){const c=K(id);openModal(`${mhead('Remettre le définitif')}<form id="f-def" data-id="${id}" class="m-body"><p>Le crédit de <b>${esc(fullName(clientOf(c.clientId)))}</b> est soldé. Le papier définitif couvre jusqu'au <b>${fdate(c.fin)}</b>.</p><div class="m-foot"><button type="button" class="btn" data-a="close-modal">Annuler</button><button class="btn primary" type="submit">Confirmer la remise</button></div></form>`)}
const waNum=t=>{const d=String(t).replace(/\D/g,'');return d.startsWith('0')?'212'+d.slice(1):d};
function waText(c,lang){const cl=clientOf(c.clientId),r=resteOf(c),lp=lastPaper(c),exp=c.type==='provisoire'&&lp&&lp.type==='provisoire'?lp.fin:null,ag=S.settings.agence;
  return lang==='ar'?`السلام عليكم ${cl.prenom}، معاك ${ag}. باقي عليك ${nf.format(r)} درهم ديال التأمين (البوليس ${c.police}).${exp?` الورقة المؤقتة كتسالي نهار ${fdate(exp)}.`:''} مرحبا بيك فالوكالة. شكرا.`
  :`Bonjour ${cl.prenom} ${cl.nom}, ici ${ag}. Il reste ${dh(r)} à régler sur votre assurance (police ${c.police}).${exp?` Votre attestation provisoire expire le ${fdate(exp)}.`:''} Merci de passer à l'agence. Bonne journée.`}
function openWA(id){const c=K(id),cl=clientOf(c.clientId),msg=waText(c,'fr');openModal(`${mhead('Rappel WhatsApp')}<form id="f-wa" data-id="${id}" class="m-body"><p class="muted">À ${esc(fullName(cl))} · <span class="tnum">${esc(cl.tel)}</span></p><div class="field"><label for="wa-lang">Langue</label><select id="wa-lang"><option value="fr">Français</option><option value="ar">Darija</option></select></div><div class="field"><label for="wa-msg">Message</label><textarea id="wa-msg" rows="5">${esc(msg)}</textarea></div><p class="faint" style="font-size:12px">WhatsApp s'ouvre dans un nouvel onglet avec ce message. Vérifiez qu'il est bien parti.</p><div class="m-foot"><button type="button" class="btn" data-a="wa-copy">${ic('copy')}Copier</button><a class="btn primary" id="wa-link" target="_blank" rel="noopener" href="https://wa.me/${waNum(cl.tel)}?text=${encodeURIComponent(msg)}" data-a="wa-log" data-id="${id}">${ic('msg')}Ouvrir WhatsApp</a></div></form>`)}
function updateWA(){const f=$('#f-wa');if(!f)return;const c=K(f.dataset.id);$('#wa-link').href=`https://wa.me/${waNum(clientOf(c.clientId).tel)}?text=${encodeURIComponent($('#wa-msg').value)}`}
function openEdit(id){const c=K(id);openModal(`${mhead('Modifier l\'assurance')}<form id="f-edit" data-id="${id}" class="m-body" novalidate><p class="hint">Chaque changement est gardé dans l'historique avec l'ancienne valeur.</p><div class="grid2"><div class="field"><label for="ed-cat">Catégorie</label><select id="ed-cat">${S.settings.categories.map(x=>`<option ${x===c.categorie?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label for="ed-att">N° attestation</label><input id="ed-att" value="${c.attestation}"></div><div class="field"><label for="ed-pol">N° police</label><input id="ed-pol" value="${c.police}"></div><div class="field"><label for="ed-q">N° quittance</label><input id="ed-q" value="${c.quittance}"></div><div class="field"><label for="ed-du">Montant dû</label><input id="ed-du" type="number" value="${c.du}"></div><div class="field"><label for="ed-pris">Montant pris</label><input id="ed-pris" type="number" value="${c.pris}" ${c.status==='complet'?'':'disabled'}></div></div><div class="field"><label for="ed-obs">Observation</label><input id="ed-obs" value="${esc(c.observation)}"></div><div class="field"><label for="ed-why">Raison de la modification</label><input id="ed-why" required placeholder="Ex. : erreur de saisie de la quittance"></div><div class="err" id="ed-err" hidden></div><div class="m-foot"><button type="button" class="btn" data-a="close-modal">Annuler</button><button class="btn primary" type="submit">Enregistrer</button></div></form>`)}
function openCancel(id){const c=K(id);openModal(`${mhead('Annuler l\'assurance')}<form id="f-cancel" data-id="${id}" class="m-body" novalidate><p>${esc(fullName(clientOf(c.clientId)))} · police <span class="mono">${c.police}</span>. La ligne reste visible dans le registre, barrée.</p><div class="field"><label for="cn-why">Raison</label><input id="cn-why" required placeholder="Ex. : attestation annulée sur le portail"></div><div class="err" id="cn-err" hidden></div><div class="m-foot"><button type="button" class="btn" data-a="close-modal">Retour</button><button class="btn primary" type="submit" style="background:var(--bad);border-color:var(--bad);color:#fff">Annuler l'assurance</button></div></form>`)}
function openReport(id){const c=K(id);openModal(`${mhead('Signaler une erreur')}<form id="f-report" data-id="${id}" class="m-body" novalidate><p class="muted">Vous ne pouvez pas modifier une assurance. Décrivez l'erreur : l'administrateur la corrigera.</p><div class="field"><label for="rp-t">Ce qui est faux</label><textarea id="rp-t" rows="3" placeholder="Ex. : le client a payé 850 et non 853"></textarea></div><div class="err" id="rp-err" hidden></div><div class="m-foot"><button type="button" class="btn" data-a="close-modal">Annuler</button><button class="btn primary" type="submit">Envoyer à l'administrateur</button></div></form>`)}
function openClientEdit(id){const cl=S.clients.find(c=>c.id===id);openModal(`${mhead('Modifier la fiche client')}<form id="f-client" data-id="${id}" class="m-body" novalidate><div class="grid2">${[['nom','Nom'],['prenom','Prénom'],['cin','CIN'],['tel','Téléphone'],['immat','Immatriculation'],['vehicule','Véhicule']].map(([k,l])=>`<div class="field"><label for="ce-${k}">${l}</label><input id="ce-${k}" value="${esc(cl[k])}"></div>`).join('')}</div><div class="m-foot"><button type="button" class="btn" data-a="close-modal">Annuler</button><button class="btn primary" type="submit">Enregistrer</button></div></form>`)}

/* ================= actions ================= */
const ACT={
  nav:id=>{route=id;closeDrawer();bellOpen=false;$('#shell')?.classList.remove('nav-open');render();window.scrollTo(0,0)},
  'nav-open':()=>$('#shell').classList.add('nav-open'),
  'nav-close':()=>$('#shell').classList.remove('nav-open'),
  logout:()=>{audit('connexion','Déconnexion');save();sess.set(null);route='dashboard';DR=null;bellOpen=false;portal={step:'form',lastId:null};closeModal();render()},
  'demo-fill':id=>{const u=S.users.find(x=>x.login===id);$('#lg-user').value=u.login;$('#lg-pwd').value=u.pwd;$('#f-login button[type=submit]').focus()},
  bell:()=>{bellOpen=!bellOpen;updateBell()},
  'notif-all':()=>{S.notifs.forEach(n=>n.read=true);save();updateBell()},
  notif:id=>{const n=S.notifs.find(x=>x.id===id);n.read=true;save();bellOpen=false;updateBell();if(n.contractId&&K(n.contractId))openDrawer('contract',n.contractId);},
  'open-contract':id=>{hideResults();openDrawer('contract',id)},
  'open-client':id=>openDrawer('client',id),
  'close-drawer':closeDrawer,
  'dr-ov':closeDrawer,
  'close-modal':closeModal,
  ov:(id,t,e)=>{if(e.target===t)closeModal()},
  'caisse-day':id=>{F.caisse.day=id;ACT.nav('caisse')},
  'cred-tab':id=>{F.cred.tab=id;renderMain()},
  complement:id=>openComplement(id,false),
  later:()=>{closeModal();toast(`À compléter : l'administrateur sera alerté après ${S.settings.delaiComplement} h sans encaissement.`,'ext')},
  pay:id=>openPay(id),paper:id=>openPaper(id),definitif:id=>openDefinitif(id),wa:id=>openWA(id),edit:id=>openEdit(id),cancel:id=>openCancel(id),report:id=>openReport(id),'client-edit':id=>openClientEdit(id),
  'wa-copy':()=>{const t=$('#wa-msg'),ok=()=>toast('Message copié');try{navigator.clipboard.writeText(t.value).then(ok,()=>{t.select();toast('Sélectionné : faites Ctrl+C')})}catch(e){t.select();toast('Sélectionné : faites Ctrl+C')}},

/* ================= global search ================= */
function hideResults(){const r=$('#gres');if(r)r.hidden=true}
function showResults(q){
  const r=$('#gres');if(!r)return;q=norm(q);if(q.length<2){r.hidden=true;return}
  const cs=scopeContracts().filter(c=>matchContract(c,q)).sort((a,b)=>{const ex=x=>norm(x.quittance)===q||norm(x.police)===q?0:1;return ex(a)-ex(b)||b.createdAt.localeCompare(a.createdAt)}).slice(0,8);
  r.innerHTML=cs.length?cs.map(c=>{const cl=clientOf(c.clientId);return `<button class="gr-item" data-a="open-contract" data-id="${c.id}"><span class="grow"><b>${esc(fullName(cl))}</b><span class="sub"><span class="mono">police ${c.police} · quittance ${c.quittance}</span> · ${fdate(c.createdAt)}</span></span>${paidPill(c)}</button>`}).join(''):'<div class="gr-empty">Aucun résultat.</div>';
  r.hidden=false;
}

/* ================= live updates ================= */
function onStorage(e){
  if(e.key!==LS||!e.newValue)return;
  const before=S?S.notifs.filter(n=>!n.read).length:0;
  try{const d=JSON.parse(e.newValue);if(d&&d.ver===1)S=d;else return}catch(x){return}
  if(!ME()){if(!$('#f-login'))render();return}
  const after=S.notifs.filter(n=>!n.read).length;
  if(isAdmin()&&after>before){const n=[...S.notifs].sort((a,b)=>b.date.localeCompare(a.date))[0];if(n)toast(n.text)}
  const ae=document.activeElement,busy=ae&&$('#main')?.contains(ae)&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName);
  if(!busy)renderMain();else updateBell();
  if(!$('#modal-root').innerHTML)renderDrawer();
  const c=$('#shell .nav .count');if(c)c.textContent=alerts().length;
}
setInterval(()=>{const u=ME();if(u&&u.role==='collab'){try{const raw=store.get(LS);if(raw){const d=JSON.parse(raw);if(d&&d.ver===1)S=d}}catch(e){}const me=ME();if(!me)return;me.ext.lastSeen=new Date().toISOString();save()}},20000);

/* ================= events ================= */
document.addEventListener('click',e=>{
  if(!e.target.closest('.bell-wrap')&&bellOpen){bellOpen=false;updateBell()}
  if(!e.target.closest('.gsearch'))hideResults();
  const t=e.target.closest('[data-a]');if(!t)return;
  if(t.dataset.a==='ov'){if(e.target===t)closeModal();return}
  const fn=ACT[t.dataset.a];if(!fn)return;
  if(t.tagName!=='A'||!t.target)e.preventDefault();
  fn(t.dataset.id,t,e);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#modal-root').innerHTML)closeModal();else if(DR)closeDrawer();else if(bellOpen){bellOpen=false;updateBell()}else hideResults()}
  if(e.key==='Enter'&&e.target.matches('tr[data-a]'))e.target.click();
  if(e.key==='Enter'&&e.target.id==='cat-new'){e.preventDefault();ACT['cat-add']()}
});
document.addEventListener('submit',e=>{e.preventDefault();const fn=SUB[e.target.id];if(fn)fn(e.target)});
let tq;
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.fq){clearTimeout(tq);tq=setTimeout(()=>{const [a,b]=t.dataset.fq.split('.');F[a][b]=t.value;renderMain()},180);return}
  if(t.id==='gsearch')showResults(t.value);
  if(t.closest('#f-complement'))updateComplementUI();
  if(t.id==='wa-msg')updateWA();
  if(t.id==='cl-esp'||t.id==='cl-chq'){const ex=expected(todayKey(),ME().id),esp=$('#cl-esp').value;const l=$('#cl-live');l.className='hint';if(esp===''){l.textContent='Saisissez les espèces comptées.';return}const d=Math.round(+esp)+Math.round(+$('#cl-chq').value||0)-(ex.esp+ex.chq);l.innerHTML=d?`Écart de <b class="${ecCls(d)}">${sdh(d)}</b> par rapport à l'attendu. Une note sera demandée.`:'Le compte est juste.'}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.f){const [a,b]=t.dataset.f.split('.');F[a][b]=t.value;renderMain();return}
  if(t.dataset.perm){const u=userOf(t.dataset.user),k=t.dataset.perm;u.perms[k]=t.checked;audit('permission',`${u.name} · ${PERMS.find(p=>p[0]===k)[1]} : ${t.checked?'autorisé':'retiré'}`);refresh();toast('Droit mis à jour');return}
  if(t.dataset.max){const u=userOf(t.dataset.max),v=Math.max(0,Math.min(100,Math.round(+t.value||0)));if(v!==u.maxEcart){audit('permission',`${u.name} · écart maximum : ${u.maxEcart} → ${v} DH`);u.maxEcart=v;refresh();toast('Limite mise à jour')}return}
  if(t.dataset.uact){const u=userOf(t.dataset.uact);u.active=t.checked;audit('permission',`Compte de ${u.name} ${t.checked?'réactivé':'désactivé'}`);refresh();toast(t.checked?'Compte réactivé':'Compte désactivé');return}
  if(t.id==='pt-client'){const c=S.clients.find(x=>x.id===t.value);['nom','prenom','cin','tel','immat','vehicule'].forEach(k=>{const el=$('#pt-'+(k==='vehicule'?'veh':k));if(el)el.value=c?(c[k]==='—'?'':c[k]):''});showErr('pt-err','')}
  if(t.id==='pt-cat'||t.id==='pt-duree')$('#pt-prime').textContent=dh(primeOf(val('pt-cat'),+val('pt-duree')));
  if(t.closest('#f-complement'))updateComplementUI();
  if(t.id==='wa-lang'){const c=K($('#f-wa').dataset.id);$('#wa-msg').value=waText(c,t.value);$('#wa-msg').dir=t.value==='ar'?'rtl':'ltr';updateWA()}
});
window.addEventListener('storage',onStorage);

load();
if(sess.get()&&!ME())sess.set(null);
if(ME())route=isAdmin()?'dashboard':'portal';
render();
})();
</script>
